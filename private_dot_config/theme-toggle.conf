# 配色モードごとの割当．theme-toggle が起動時に読み込む．
# 値を変えたあと再度トグルすれば反映される．

# --- Claude Code (~/.claude/settings.json の theme) ---
# 指定できる値:
#   light / dark                      標準
#   light-daltonized / dark-daltonized  色覚多様性対応 (差分を青と橙で示す)
#   light-ansi / dark-ansi            端末の16色パレットだけで描画する
#   auto                              端末の配色を検知して自動で選ぶ
# 空にすると theme-toggle は Claude Code の設定に触らない．
CLAUDE_THEME_LIGHT="light-daltonized"
CLAUDE_THEME_DARK="dark-daltonized"

# --- herdr (組み込みテーマ名) ---
# catppuccin / terminal / tokyo-night / tokyo-night-day / dracula / nord /
# gruvbox / gruvbox-light / one-dark / one-light / solarized / solarized-light /
# kanagawa / kanagawa-lotus / rose-pine / rose-pine-dawn / vesper
HERDR_THEME_LIGHT="tokyo-night-day"
HERDR_THEME_DARK="tokyo-night"

# --- waybar (~/.config/waybar/ 配下の css ファイル名) ---
WAYBAR_CSS_LIGHT="latte.css"
WAYBAR_CSS_DARK="frappe.css"

# hypridle 設定: アイドル・サスペンド・ロックの統合管理
#
# lock_cmd は scripts/lock.sh 経由で hyprlock を起動する．
# lock.sh が二重起動を防ぎつつ，hyprlock がクラッシュしたら自動で上げ直すため，
# ロック画面が落ちてセッションが固まる (電源長押ししか手が無くなる) 事故を防げる．
# 併せて hyprland.conf の misc:allow_session_lock_restore = true が必要．

general {
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 無操作 10 分でロックする
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 無操作 15 分で内蔵画面 (eDP-1) だけを消灯し，操作で復帰する．
#
# 外部モニターは意図的に消灯対象から外している．
# 全画面に対して dpms off を投げると HDMI 接続の外部モニター (Dell S2721HN) で
# リンクが落ち，切断と再接続を 9 秒周期で延々と繰り返す現象が起きる．
# 2026-08-25 には 74 分で 477 回発生し，その出力変化を処理していた hyprlock が
# SIGSEGV で落ちてセッションごと固まった．
# 外部モニターは常時点灯のままになるが，モニター側の省電力設定で対応する．
#
# ここで直接 `hyprctl dispatch dpms off eDP-1` と書いてはいけない．
# クラムシェル運用中は lid.sh が eDP-1 を無効化してモニター一覧から消すため，
# Hyprland が対象を絞れず全モニターを消灯してしまう (0.55.4 で実測確認)．
# dpms_internal.sh が在否を確認してから投げる．
listener {
    timeout = 900
    on-timeout = $HOME/.config/hypr/scripts/dpms_internal.sh off
    on-resume = $HOME/.config/hypr/scripts/dpms_internal.sh on
}

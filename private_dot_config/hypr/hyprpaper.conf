# hyprpaper 0.8+ 新形式
# モニターごとに wallpaper ブロックを定義
# 画像は Real-ESRGAN (realesrgan-x4plus-anime) で 4倍アップスケール済み (5376x3072)

# DP-2: Eizo EV3285 (4K メイン) - 緑屋根の家
wallpaper {
    monitor = DP-2
    path = /home/yoshimi/Pictures/wallpaper/line_art_v2_4x/20260513_171753_line_art_4x.png
    fit_mode = cover
}

# HDMI-A-1: Dell U2718Q (4K) - 材料の瓶
wallpaper {
    monitor = HDMI-A-1
    path = /home/yoshimi/Pictures/wallpaper/line_art_v2_4x/20260513_171601_line_art_4x.png
    fit_mode = cover
}

# eDP-1: ノートPC内蔵 - 街並み
wallpaper {
    monitor = eDP-1
    path = /home/yoshimi/Pictures/wallpaper/line_art_v2_4x/20260513_171823_line_art_4x.png
    fit_mode = cover
}

# デフォルト壁紙: monitor 名が空のブロックは上で未定義の出力すべてに適用される．
# DP-1 のような未定義モニターや将来の新規出力にも必ず壁紙が付く．
wallpaper {
    monitor =
    path = /home/yoshimi/Pictures/wallpaper/line_art_v2_4x/20260513_171823_line_art_4x.png
    fit_mode = cover
}

# スプラッシュテキストの表示
splash = true

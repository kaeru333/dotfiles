# DP-2 に type-C 変換経由で Dell U2718Q を挿すと 3840x2160@30 止まりになる．
# これはアダプタ側のハード上限で，modeline を強制しても直らない (2026-08-13 検証済み)．
#   /sys/kernel/debug/dri/1/DP-2/link_settings -> Current/Verified/Reported とも 2 lane, rate 0x14
#   = 2 レーン x HBR2 5.4Gbps，実効 8.64Gbps． 4K60 8bpc RGB は 594MHz x 24bpp = 14.26Gbps 必要．
#   4K30 は 7.13Gbps なので収まる． Reported も 2 なので DPCD 申告値そのものが 2 レーン．
#   実体は Apple USB-C Digital AV Multiport Adapter (USB hub が 05ac:100e で見える) の
#   HDMI 1.4b 世代．USB 3.0 と帯域を分け合う pin assignment のため DP は 2 レーンしか来ない．
# 4K60 が要るときは HDMI 2.0 対応アダプタに替えるか，モニターの DP 入力へ USB-C -> DP で直結する．
monitor=DP-2,preferred,0x0,1
monitor=eDP-1,preferred,0x2160,1
# HDMI-A-1: Dell U2718Q を HDMI へ直挿しするときだけ縦置き + VIC 97 modeline．
# (aquamarine 0.12 の preferred 解決回帰対策の modeline を desc: からコネクタ名指定へ移設．
#  desc: は EDID 前方一致でポートに依存せずマッチし，かつコネクタ名指定より優先されるため，
#  type-C 変換経由で DP-2 として認識される場合まで回転・scale 1.5 が波及してしまう)
monitor=HDMI-A-1,modeline 594 3840 4016 4104 4400 2160 2168 2178 2250 +hsync +vsync,auto,1.5,transform,3

monitor=DP-2,preferred,0x0,1
monitor=DP-1,preferred,3840x0,1
# HDMI-A-1: Dell U2718Q を HDMI へ直挿しするときだけ縦置き + VIC 97 modeline．
# (aquamarine 0.12 の preferred 解決回帰対策の modeline を desc: からコネクタ名指定へ移設．
#  desc: は EDID 前方一致でポートに依存せずマッチし，かつコネクタ名指定より優先されるため，
#  type-C 変換経由で DP-2 として認識される場合まで回転・scale 1.5 が波及してしまう)
monitor=HDMI-A-1,modeline 594 3840 4016 4104 4400 2160 2168 2178 2250 +hsync +vsync,auto,1.5,transform,3

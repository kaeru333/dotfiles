monitor=eDP-1,preferred,0x0,1
# HDMI-A-1: 既定は preferred で任意モニタを 1920x0 に表示する (自宅の DELL S2721HN 等)．
# Dell U2718Q のときだけ desc: マッチで VIC 97 modeline を上書きする (aquamarine 0.12 対策)．
# desc: は前方一致・規則は last-wins のため desc 行を後に置く (U2718Q では desc が勝つ)．
monitor=HDMI-A-1,preferred,1920x0,1
monitor=desc:Dell Inc. DELL U2718Q,modeline 594 3840 4016 4104 4400 2160 2168 2178 2250 +hsync +vsync,1920x0,1

[main]
# font=CodeNewRoman Nerd Font Propo:size=26
# font=CodeNewRoman Nerd Font Propo:size=20
# font=codenewroman nerd font propo:size=18
# font=codenewroman nerd font propo:size=16
# font=codenewroman nerd font propo:size=14
font=codenewroman nerd font propo:size=12
# font=codenewroman nerd font propo:size=10

# 配色モードの可変部 (initial-color-theme) は theme-toggle が theme.ini を書き換える．
# 実行中のウィンドウは SIGUSR1 (light) / SIGUSR2 (dark) で即時切り替わる．
include=~/.config/foot/theme.ini

# ダークモード: 従来の配色 (catppuccin 系) ．透過あり．
[colors-dark]
alpha=0.75
foreground=cdd6f4
background=25281a
# カーソル色 (text cursor)．foot 1.27 で [cursor].color から移動
cursor=11111b f5e0dc

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

16=fab387
17=f5e0dc

selection-foreground=cdd6f4
selection-background=414356

search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244

jump-labels=11111b fab387
urls=89b4fa

# ライトモード: tokyo-night-day ．透過なし．
[colors-light]
alpha=1.0
foreground=3760bf
background=e1e2e7
cursor=e1e2e7 3760bf

regular0=b4b5b9
regular1=f52a65
regular2=587539
regular3=8c6c3e
regular4=2e7de9
regular5=9854f1
regular6=007197
regular7=6172b0

bright0=a1a6c5
bright1=ff4774
bright2=5c8524
bright3=a27629
bright4=358aff
bright5=a463ff
bright6=007ea8
bright7=3760bf

16=b15c00
17=8c6c3e

selection-foreground=3760bf
selection-background=b7c1e3

search-box-no-match=e1e2e7 f52a65
search-box-match=3760bf c4c8da

jump-labels=e1e2e7 b15c00
urls=2e7de9

# Shift+Return で § (U+00A7) を送出する (アプリ側で Shift+Return を判別するため)
# foot 1.27 では text: アクションが廃止され [text-bindings] (\x バイト列=キー) を使う
[text-bindings]
\xc2\xa7=Shift+Return
